<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Face landmarks · FaceMeshFaceGeometry</title>
    <style>
      gum-av,
      canvas {
        position: absolute;
        left: 0;
        top: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        height: 100%;
      }

      canvas {
        margin: auto;
      }

      #container {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: black;
      }

      #info {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        max-width: 22em;
        padding: 1em;
        pointer-events: none;
        color: white;
        font-family: roboto, sans-serif;
        font-size: 14px;
        line-height: 1.4;
        text-shadow: 0 1px 3px black;
        z-index: 1;
      }

      #info h1 {
        font-size: 1.3em;
        font-weight: bold;
      }

      #info p {
        margin: 0.4em 0 0;
      }

      #status:empty {
        display: none;
      }

      gum-av {
        font-family: roboto, sans-serif;
        color: white;
        opacity: 0;
        transition: opacity 1s ease-out;
      }
      #annotations {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1;
        font: bold 12px roboto, sans-serif;
      }

      #annotations line {
        stroke: white;
        stroke-width: 1.5;
      }

      #annotations line.outline {
        stroke: black;
        stroke-width: 4;
      }

      #annotations text {
        fill: white;
        stroke: black;
        stroke-width: 4px;
        paint-order: stroke;
        dominant-baseline: middle;
      }
    </style>
  </head>

  <body>
    <header id="info">
      <h1>Face landmarks</h1>
      <p>Labels follow 24 parts of the face, using the landmarks in video pixels with an orthographic camera. A bit of 2D physics keeps the labels apart and lets them trail the face.</p>
      <p id="status">Loading...</p>
    </header>
    <div id="container">
      <gum-av></gum-av>
      <canvas id="canvas"></canvas>
      <svg id="annotations">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="white" stroke="black" stroke-width="1.2" stroke-linejoin="round" />
          </marker>
        </defs>
      </svg>
    </div>
    <script type="importmap">
      { "imports": { "three": "../../third_party/three.module.js" } }
    </script>
    <script src="../../third_party/gum-av.js" type="module"></script>
    <script src="main.js" type="module"></script>
  </body>
</html>
